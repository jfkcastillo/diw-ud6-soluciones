<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>Ejercicio 6</title>
    <style type="text/css">
        div#paginacion {
            background-color: #dcdcdc;
            border: 1px solid #c0c0c0;
            padding: 8px 12px;
            margin: 15px 25px;
            font-family: "Times New Roman", Times, serif;
            font-size: 14pt;
            font-weight: bold;
        }

        .derecha {
            float: right;
        }

        .izquierda {
            float: left;
        }

        div.clear {
            clear: both;
        }
    </style>
</head>
<body>
    <div id="paginacion">
        <span class="izquierda">« Anterior</span>
        <span class="derecha">Siguiente »</span>
        <div class="clear"></div>
    </div>
</body>
</html>
